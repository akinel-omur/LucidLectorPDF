name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node web/tests/run-tests.mjs web/tests/sample.pdf
      - run: node web/tests/paragraph-tests.mjs
      - run: node web/tests/static-check.mjs
      - run: node web/tests/matching-tests.mjs
      - name: dom-smoke
        run: |
          npm install jsdom --no-save
          node web/tests/dom-smoke.mjs
